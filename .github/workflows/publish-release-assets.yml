name: Publish release downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to attach downloads to
        type: choice
        default: v0.2
        options: [v0.2, v1.7.4-en]

permissions:
  contents: write

jobs:
  upload:
    if: github.repository == 'XHYN-PH/XHYN-V-reborn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Download, verify and attach release files
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v0.2)
              artifact_folder=0.2
              artifact_prefix=XHYN-V-0.2
              ;;
            v1.7.4-en)
              artifact_folder=1.7.4-en
              artifact_prefix=XHYN-V-1.7.4-English
              ;;
            *) exit 2 ;;
          esac
          artifact_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/releases/${artifact_folder}"
          artifact_directory=$(mktemp -d)
          cd "$artifact_directory"
          files=(
            "${artifact_prefix}.apk"
            "${artifact_prefix}-Public-Source.zip"
            "${artifact_prefix}-verification.md"
            SHA256SUMS.txt
          )
          for file in "${files[@]}"; do
            curl --fail --location --silent --show-error --retry 2 \
              --connect-timeout 20 --max-time 180 \
              "${artifact_url}/${file}" --output "$file"
          done
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
